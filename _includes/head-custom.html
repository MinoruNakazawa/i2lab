{% assign og_image_path = page.og_image | default: site.og_image %}
{% if og_image_path %}
  <meta property="og:image" content="{{ og_image_path | absolute_url }}">
  <meta name="twitter:image" content="{{ og_image_path | absolute_url }}">
{% endif %}
<meta name="twitter:card" content="{{ site.twitter.card | default: 'summary_large_image' }}">
