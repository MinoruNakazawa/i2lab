AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Secure serverless meeting room reservation app for 31-205 and 31-202.

Parameters:
  DeletePin:
    Type: String
    NoEcho: true
    MinLength: 4
    Description: PIN required when deleting reservations.
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Secret header value CloudFront sends to Lambda through API Gateway.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email address for CloudWatch alarm notifications.
  AllowedCorsOrigin:
    Type: String
    Default: "https://example.invalid"
    Description: Browser origin allowed when calling API Gateway directly. CloudFront same-origin access does not need CORS.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 128
    Architectures:
      - arm64
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref ReservationsTable
        CORS_ORIGIN: !Ref AllowedCorsOrigin
        DELETE_PIN: !Ref DeletePin
        DELETE_PIN_PEPPER: !Ref OriginVerifySecret
        ORIGIN_VERIFY_SECRET: !Ref OriginVerifySecret
        TZ: "Asia/Tokyo"

Resources:
  ReservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  ReservationsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ReservationsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: api/lambda.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Scan
              Resource: !GetAtt ReservationsTable.Arn
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReservationsApi
            Path: /api/health
            Method: GET
        ListReservations:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReservationsApi
            Path: /api/reservations
            Method: GET
        CreateReservation:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReservationsApi
            Path: /api/reservations
            Method: POST
        DeleteReservation:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReservationsApi
            Path: /api/reservations/{id}
            Method: DELETE
        UpdateReservation:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReservationsApi
            Path: /api/reservations/{id}
            Method: PUT
        OptionsProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReservationsApi
            Path: /api/{proxy+}
            Method: OPTIONS
  StaticAssetBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  StaticAssetBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticAssetBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${StaticAssetBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}"

  WebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-s3-oac"
        Description: Access control for private S3 static assets.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
            Preload: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"
            Override: true

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt StaticAssetBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebsiteOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !Sub "${ReservationsApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerifySecret
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Reservation Lambda has errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReservationsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Reservation API has 5xx responses.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ReservationsApi
        - Name: Stage
          Value: "$default"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  DynamoDbThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Reservation table has throttled requests.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref ReservationsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

Outputs:
  WebsiteUrl:
    Description: CloudFront HTTPS website URL.
    Value: !Sub "https://${WebsiteDistribution.DomainName}"
  CloudFrontDistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref WebsiteDistribution
  ApiUrl:
    Description: API Gateway endpoint. Prefer WebsiteUrl for browser access.
    Value: !Sub "https://${ReservationsApi}.execute-api.${AWS::Region}.amazonaws.com"
  ReservationsTableName:
    Description: DynamoDB table name.
    Value: !Ref ReservationsTable
  ReservationsFunctionName:
    Description: Lambda function name for API.
    Value: !Ref ReservationsFunction
  StaticAssetBucketName:
    Description: Private S3 bucket for static files.
    Value: !Ref StaticAssetBucket
